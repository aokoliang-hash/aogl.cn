  <div class="lang-zh article-body brief-body"><p class="brief-note"><strong>說明：</strong>本頁為 aogl.cn 書籤站整理的工具簡介，非廠商官方文檔；功能與價格以官網為準。</p><p><strong>Replit</strong> 歸類在「編程與 IDE」，屬於AI 編程輔助與智能體環境。本站收錄便於從首頁目錄快速瞭解用途，再一鍵打開官網註冊或使用。</p><h2>常見用途</h2><ul class="brief-bullets"><li>IDE 內補全與重構</li><li>結合倉庫上下文的問答與小功能腳手架</li><li>配合現有 Git 工作流使用</li></ul><p>主域名：<code>replit.com</code>。若你已使用該工具，建議通過下方按鈕訪問官網以獲取最新模型列表與賬戶設置。</p></div>
