<p><strong>구축 수기</strong>: aogl.cn은 <code>_multilang/</code> 소스를 <code>scripts/build-seo-locale-pages.mjs</code>로 로케일 분리합니다. <code>build-articles.mjs</code>, <code>inject-site-nav.mjs</code>, <code>seo-index-policy.mjs</code>의 <code>ARTICLE_ARCHIVE_NOINDEX</code>, 그리고 <code>js/adsense.js</code>는 색인 가능 페이지만 AdSense를 로드합니다. 홈 아웃바운드는 <code>adsense-slim-outbound.mjs</code>로 줄입니다.</p>
