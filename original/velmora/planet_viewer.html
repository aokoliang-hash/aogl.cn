<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velmora — 3D Planet Viewer</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#07090f; overflow:hidden; font-family:'Courier New',monospace; color:#e0e8ff; width:100vw; height:100vh; }
canvas { display:block; width:100vw; height:100vh; cursor:grab; }
canvas:active { cursor:grabbing; }
.hud { position:fixed; pointer-events:none; z-index:10; }
.tl { top:24px; left:24px; font-size:10px; color:#4a9eff88; line-height:2; letter-spacing:1.5px; text-transform:uppercase; }
.tr { top:24px; right:24px; text-align:right; line-height:1.6; }
.pname { font-size:28px; font-weight:700; letter-spacing:6px; color:#fff; text-shadow:0 0 30px rgba(255,200,150,.3); }
.psub { font-size:9px; color:#4a9effaa; letter-spacing:2px; margin-top:2px; }
.badge { display:inline-block; padding:2px 10px; border-radius:12px; font-size:8px; letter-spacing:1.5px; margin-top:3px; }
.hot { border:1px solid rgba(255,120,50,.35); background:rgba(255,100,40,.10); color:#ff8855cc; }
.blue { border:1px solid rgba(74,158,255,.30); background:rgba(74,158,255,.08); color:#4a9effcc; }
.bl { bottom:28px; left:24px; font-size:9px; color:#ffffff33; letter-spacing:2px; text-transform:uppercase; line-height:2; }
.br { bottom:28px; right:24px; text-align:right; font-size:9px; color:#ffffff22; letter-spacing:1px; line-height:2; }
#loader { position:fixed; inset:0; background:#07090f; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:100; transition:opacity .8s; }
.ring { width:56px; height:56px; border:1px solid rgba(74,158,255,.15); border-top-color:#4a9effaa; border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.ltxt { font-size:9px; letter-spacing:3px; color:#4a9eff66; text-transform:uppercase; max-width:260px; text-align:center; }
#src-label { position:fixed; bottom:56px; left:50%; transform:translateX(-50%); font-size:8px; color:#ffffff22; letter-spacing:1px; pointer-events:none; white-space:nowrap; }
</style>
</head>
<body>
<div id="loader"><div class="ring"></div><div class="ltxt" id="ltxt">Loading HD texture...</div></div>
<canvas id="c"></canvas>
<div class="hud tl">
  <div>◈ Live Render</div>
  <div><span class="badge hot">⊕ +280°C</span></div>
  <div><span class="badge blue">◯ 2 Moons</span></div>
  <div style="margin-top:10px;color:#ffffff22;font-size:8px">CLASS III GAS GIANT</div>
  <div style="color:#ffffff22;font-size:8px">TIDALLY LOCKED</div>
</div>
<div class="hud tr">
  <div class="pname">Velmora</div>
  <div class="psub">ORBIT 2.30 AU &nbsp;·&nbsp; PERIOD 14.0d</div>
</div>
<div class="hud bl"><div>Scroll — Zoom</div><div>Drag — Rotate</div></div>
<div class="hud br"><div id="zd">zoom 1.0×</div><div id="fpsd">— fps</div></div>
<div id="src-label"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Candidate HD texture URLs (browser tries each, CORS must allow) ────────
const SOURCES = [
  { label:"Jupiter HD (jeromeetienne/threex)",
    url:"velmora.png" },
  { label:"Jupiter (mrdoob/three.js mirror)",
    url:"velmora.png" },
  { label:"Gas Giant (nasa-3d-resources)",
    url:"velmora.png" },
  { label:"Jupiter 2K (Tanakrit solar system)",
    url:"velmora.png" },
  { label:"Jupiter (vexcel mirror)",
    url:"velmora.png" },
];

// ── Renderer setup ─────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 200);
camera.position.set(0, 0, 3.5);

// Stars
(() => {
  const g = new THREE.BufferGeometry();
  const v = [];
  for (let i = 0; i < 3000; i++) {
    const th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1), r = 80+Math.random()*20;
    v.push(r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th));
  }
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0xffffff, size:.07, sizeAttenuation:true, transparent:true, opacity:.7 })));
})();

// Lights
const sun = new THREE.DirectionalLight(0xfff5e8, 2.0); sun.position.set(5,3,4); scene.add(sun);
const fill = new THREE.DirectionalLight(0x334466, 0.35); fill.position.set(-4,-2,-4); scene.add(fill);
scene.add(new THREE.AmbientLight(0x223355, 0.55));

let planet, moon1, moon2;

// ── Procedural fallback texture ────────────────────────────────────────────
function buildProceduralTex() {
  const W = 2048, H = 1024;
  const oc = document.createElement('canvas'); oc.width=W; oc.height=H;
  const cx = oc.getContext('2d');

  const palette = [
    ['#e8c9a8','#d4b090'],['#c87448','#b86438'],['#a2d8c8','#82c4b0'],
    ['#e8d0b0','#d4bc98'],['#c06840','#b05830'],['#f0e4cc','#e0d0b4'],
    ['#c87858','#b86848'],['#e4d0b0','#d0bc98'],['#90c8b8','#70b0a0'],
    ['#e0a870','#d09060'],['#dcc8a4','#c8b490'],['#b07050','#a06040'],
    ['#a8d0c0','#88baa8'],['#d88858','#c87848'],['#e8d8b8','#d8c8a8'],
    ['#c07858','#b06848'],
  ];
  palette.forEach((pair, i) => {
    const y0 = Math.round(i/palette.length*H);
    const y1 = Math.round((i+1)/palette.length*H);
    const grd = cx.createLinearGradient(0,y0,0,y1);
    grd.addColorStop(0,pair[0]); grd.addColorStop(1,pair[1]);
    cx.fillStyle=grd; cx.fillRect(0,y0,W,y1-y0+1);
  });

  // Turbulence
  for (let row=0; row<32; row++) {
    const by = row/32*H;
    cx.beginPath(); cx.moveTo(0,by);
    for (let x=0; x<=W; x+=3) {
      const y = by + Math.sin(x*.013+row*1.2)*12 + Math.sin(x*.031+row*.8)*6 + Math.sin(x*.07+row*2.1)*3;
      cx.lineTo(x,y);
    }
    cx.strokeStyle='rgba(0,0,0,0.06)'; cx.lineWidth=1.5; cx.stroke();
  }

  // Vortex helper
  function vortex(vx,vy,rx,ry,c1,c2) {
    cx.save(); cx.translate(vx,vy); cx.scale(1,ry/rx); cx.translate(-vx,-vy);
    const rg=cx.createRadialGradient(vx,vy,0,vx,vy,rx);
    rg.addColorStop(0,c1); rg.addColorStop(.5,c2); rg.addColorStop(1,'rgba(0,0,0,0)');
    cx.beginPath(); cx.arc(vx,vy,rx,0,Math.PI*2); cx.fillStyle=rg; cx.fill();
    for (let arm=0;arm<3;arm++) {
      const sa=arm/3*Math.PI*2; cx.beginPath();
      for (let t=0;t<Math.PI*2.4;t+=.04) {
        const rr=8+t*rx*.3, px=vx+rr*Math.cos(sa+t*1.3), py=vy+rr*Math.sin(sa+t*1.3);
        t===0?cx.moveTo(px,py):cx.lineTo(px,py);
      }
      cx.strokeStyle='rgba(255,255,255,.09)'; cx.lineWidth=2.5; cx.stroke();
    }
    cx.restore();
  }
  vortex(580,590,95,65,'rgba(72,170,155,.98)','rgba(72,170,155,.4)');
  vortex(1400,265,44,30,'rgba(255,242,222,.75)','rgba(200,180,150,.3)');
  vortex(290,750,38,26,'rgba(255,242,222,.65)','rgba(190,165,130,.25)');
  vortex(1720,680,32,22,'rgba(255,242,222,.60)','rgba(185,160,125,.2)');

  // Pixel-level saturation + contrast
  const id=cx.getImageData(0,0,W,H); const dd=id.data;
  for (let i=0;i<dd.length;i+=4) {
    const r=dd[i],g=dd[i+1],b=dd[i+2];
    // contrast
    const cr=((r/255-.5)*1.4+.5)*255;
    const cg=((g/255-.5)*1.4+.5)*255;
    const cb=((b/255-.5)*1.4+.5)*255;
    // saturation
    const avg=(cr+cg+cb)/3, sat=1.6;
    dd[i]  =Math.max(0,Math.min(255,avg+(cr-avg)*sat));
    dd[i+1]=Math.max(0,Math.min(255,avg+(cg-avg)*sat));
    dd[i+2]=Math.max(0,Math.min(255,avg+(cb-avg)*sat));
  }
  cx.putImageData(id,0,0);

  const tex=new THREE.CanvasTexture(oc);
  tex.wrapS=THREE.RepeatWrapping; tex.wrapT=THREE.ClampToEdgeWrapping;
  tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
  document.getElementById('src-label').textContent='Procedural gas giant texture';
  return tex;
}

// ── Try each URL, fall back to procedural ─────────────────────────────────
function loadWithFallback(sources, idx, onDone) {
  if (idx >= sources.length) { onDone(buildProceduralTex()); return; }
  const s = sources[idx];
  document.getElementById('ltxt').textContent = `Loading: ${s.label}`;
  const loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');
  loader.load(s.url,
    tex => {
      tex.encoding=THREE.sRGBEncoding;
      tex.wrapS=THREE.RepeatWrapping; tex.wrapT=THREE.ClampToEdgeWrapping;
      tex.anisotropy=renderer.capabilities.getMaxAnisotropy();
      tex.minFilter=THREE.LinearMipmapLinearFilter;
      tex.magFilter=THREE.LinearFilter;
      document.getElementById('src-label').textContent=`Texture: ${s.label}`;
      onDone(tex);
    },
    undefined,
    () => loadWithFallback(sources, idx+1, onDone)
  );
}

loadWithFallback(SOURCES, 0, tex => buildScene(tex));

// ── Scene builder ─────────────────────────────────────────────────────────
function buildScene(tex) {
  const geo = new THREE.SphereGeometry(1,128,128);
  const mat = new THREE.MeshStandardMaterial({ map:tex, roughness:.72, metalness:0 });
  planet = new THREE.Mesh(geo, mat);
  scene.add(planet);

  // Atmosphere rim shader
  const aMat = new THREE.ShaderMaterial({
    vertexShader:`varying vec3 vN,vV;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
    fragmentShader:`varying vec3 vN,vV;void main(){float r=pow(1.-abs(dot(vN,vV)),2.5);gl_FragColor=vec4(.42,.65,1.,1.)*r*.72;}`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.FrontSide
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.037,64,64), aMat));

  // Halo
  scene.add(new THREE.Mesh(
    new THREE.SphereGeometry(1.14,32,32),
    new THREE.MeshBasicMaterial({color:0x8899cc,transparent:true,opacity:.04,side:THREE.BackSide,depthWrite:false,blending:THREE.AdditiveBlending})
  ));

  // Orbit ring
  const pts=[];
  for(let i=0;i<=256;i++){const a=i/256*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*1.58,-0.45,Math.sin(a)*1.58));}
  scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xc8a055,transparent:true,opacity:.3})));

  buildMoons();
  document.getElementById('loader').style.opacity='0';
  setTimeout(()=>document.getElementById('loader').style.display='none',800);
}

// ── Moon textures ─────────────────────────────────────────────────────────
function moonTex(hex,craters,ice){
  const mc=document.createElement('canvas');mc.width=512;mc.height=512;
  const cx=mc.getContext('2d');
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const grd=cx.createRadialGradient(200,180,10,256,256,290);
  grd.addColorStop(0,`rgb(${Math.min(255,r+30)},${Math.min(255,g+28)},${Math.min(255,b+25)})`);
  grd.addColorStop(1,`rgb(${Math.max(0,r-45)},${Math.max(0,g-42)},${Math.max(0,b-40)})`);
  cx.fillStyle=grd;cx.fillRect(0,0,512,512);
  for(let i=0;i<500;i++){cx.beginPath();cx.arc(Math.random()*512,Math.random()*512,1+Math.random()*4,0,Math.PI*2);cx.fillStyle=`rgba(0,0,0,${Math.random()*.2})`;cx.fill();}
  if(craters)for(let i=0;i<22;i++){
    const x=Math.random()*512,y=Math.random()*512,cr=5+Math.random()*22;
    const cg=cx.createRadialGradient(x,y,0,x,y,cr);
    cg.addColorStop(0,'rgba(15,12,10,.62)');cg.addColorStop(.6,'rgba(15,12,10,.12)');cg.addColorStop(.9,'rgba(210,200,185,.14)');cg.addColorStop(1,'rgba(0,0,0,0)');
    cx.beginPath();cx.arc(x,y,cr,0,Math.PI*2);cx.fillStyle=cg;cx.fill();
  }
  if(ice){
    for(let i=0;i<14;i++){cx.beginPath();cx.moveTo(Math.random()*512,Math.random()*512);for(let j=0;j<6;j++)cx.lineTo(Math.random()*512,Math.random()*512);cx.strokeStyle=`rgba(130,185,245,${.1+Math.random()*.16})`;cx.lineWidth=1+Math.random()*2;cx.stroke();}
    for(let i=0;i<10;i++){const x=Math.random()*512,y=Math.random()*512,cr=25+Math.random()*60;const pg=cx.createRadialGradient(x,y,0,x,y,cr);pg.addColorStop(0,'rgba(50,120,210,.16)');pg.addColorStop(1,'rgba(0,0,0,0)');cx.beginPath();cx.arc(x,y,cr,0,Math.PI*2);cx.fillStyle=pg;cx.fill();}
  }
  const id=cx.getImageData(0,0,512,512);const dd=id.data;
  for(let i=0;i<dd.length;i+=4){for(let ch=0;ch<3;ch++){let v=dd[i+ch];v=((v/255-.5)*1.3+.5)*255;dd[i+ch]=Math.max(0,Math.min(255,v));}}
  cx.putImageData(id,0,0);
  return new THREE.CanvasTexture(mc);
}

function buildMoons(){
  moon1=new THREE.Mesh(new THREE.SphereGeometry(.09,48,48),new THREE.MeshStandardMaterial({map:moonTex('#b0a898',true,false),roughness:.88,metalness:0}));
  scene.add(moon1);
  moon2=new THREE.Mesh(new THREE.SphereGeometry(.12,48,48),new THREE.MeshStandardMaterial({map:moonTex('#cce0f4',false,true),roughness:.40,metalness:.02}));
  scene.add(moon2);
}

// ── Controls ──────────────────────────────────────────────────────────────
let drag=false,lx=0,ly=0,yaw=.3,pitch=1.45,tYaw=.3,tPitch=1.45,radius=3.5,tRadius=3.5;
const MIN=1.4,MAX=8.0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('touchstart',e=>{drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('touchend',()=>drag=false);
window.addEventListener('mousemove',e=>{if(!drag)return;tYaw+=(e.clientX-lx)*.005;tPitch+=(e.clientY-ly)*.004;tPitch=Math.max(.1,Math.min(Math.PI-.1,tPitch));lx=e.clientX;ly=e.clientY;});
window.addEventListener('touchmove',e=>{if(!drag||e.touches.length!==1)return;tYaw+=(e.touches[0].clientX-lx)*.005;tPitch+=(e.touches[0].clientY-ly)*.004;tPitch=Math.max(.1,Math.min(Math.PI-.1,tPitch));lx=e.touches[0].clientX;ly=e.touches[0].clientY;},{passive:true});
canvas.addEventListener('wheel',e=>{e.preventDefault();tRadius+=e.deltaY*.004;tRadius=Math.max(MIN,Math.min(MAX,tRadius));},{passive:false});
let pinch=null;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=null;});
canvas.addEventListener('touchmove',e=>{if(e.touches.length!==2)return;const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);if(pinch!==null){tRadius-=(d-pinch)*.015;tRadius=Math.max(MIN,Math.min(MAX,tRadius));}pinch=d;},{passive:true});
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});

const lerp=(a,b,t)=>a+(b-a)*t;
const clock=new THREE.Clock();
let lTime=performance.now(),fc=0;

function frame(){
  requestAnimationFrame(frame);
  const t=clock.getElapsedTime();
  yaw=lerp(yaw,tYaw,.08);pitch=lerp(pitch,tPitch,.08);radius=lerp(radius,tRadius,.08);
  camera.position.x=radius*Math.sin(pitch)*Math.sin(yaw);
  camera.position.y=radius*Math.cos(pitch);
  camera.position.z=radius*Math.sin(pitch)*Math.cos(yaw);
  camera.lookAt(0,0,0);
  if(planet)planet.rotation.y=t*.07;
  if(moon1&&moon2){
    const a1=t*.38;moon1.position.set(Math.cos(a1)*1.58,Math.sin(a1*.28)*.12-.1,Math.sin(a1)*1.58);moon1.rotation.y=t*.3;
    const a2=t*.24+2.1;moon2.position.set(Math.cos(a2)*2.18,Math.sin(a2*.2)*.16+.08,Math.sin(a2)*2.18);moon2.rotation.y=t*.18;
  }
  fc++;const now=performance.now();
  if(now-lTime>1000){document.getElementById('fpsd').textContent=Math.round(fc*1000/(now-lTime))+' fps';fc=0;lTime=now;}
  document.getElementById('zd').textContent='zoom '+(.5+(MAX-radius)/(MAX-MIN)*3.5).toFixed(1)+'×';
  renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
