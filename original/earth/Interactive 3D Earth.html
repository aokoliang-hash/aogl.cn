<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Solar System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #11131a; /* Dark background similar to image */
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* UI Overlay Layer - keeping it above canvas */
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas by default */
        }
        
        /* Make specific UI elements clickable */
        .interactive {
            pointer-events: auto;
        }

        /* Glassmorphism utility classes */
        .glass-panel {
            background: rgba(30, 32, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 9999px; /* Pill shape */
        }
        
        .glass-panel-rect {
             background: rgba(30, 32, 40, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 1.5rem; /* Rounded rectangle */
        }

        /* Custom Scrollbar for planet nav on small screens */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

        /* Navigation Buttons */
        .nav-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            color: #a0aec0;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .nav-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        
        /* Bottom Action Buttons */
        .action-btn {
            background: rgba(40, 42, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        
        .action-btn:hover {
             background: rgba(60, 62, 70, 0.9);
        }

        .action-btn.primary {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            border: none;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        
        .action-btn.primary:hover {
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
            transform: translateY(-1px);
        }

        /* Status Indicator */
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle, #4ade80 20%, #3b82f6 80%);
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

    </style>
    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="flex flex-col h-screen">

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- Top UI Container -->
    <div class="ui-layer p-6 w-full flex flex-col md:flex-row justify-between items-start gap-6 max-w-7xl mx-auto mt-4">
        
        <!-- Left Side: System Status & Stats -->
        <div class="flex flex-col gap-4">
            <!-- Status Badge -->
            <div class="glass-panel interactive flex items-center gap-3 px-5 py-3 w-fit">
                <div class="status-dot animate-pulse"></div>
                <span class="font-medium text-sm tracking-wide">系统扫描激活</span>
            </div>

            <!-- Stats Row -->
            <div class="flex gap-3 mt-2">
                <div class="glass-panel interactive px-4 py-2 flex flex-col items-center justify-center min-w-[100px]">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1">表面温度</span>
                    <span class="font-mono text-sm" id="stat-temp">15°C</span>
                </div>
                <div class="glass-panel interactive px-4 py-2 flex flex-col items-center justify-center min-w-[100px]">
                    <span class="text-xs text-gray-400 uppercase tracking-wider mb-1">已知卫星</span>
                    <span class="font-mono text-sm" id="stat-moons">1</span>
                </div>
            </div>
        </div>

        <!-- Right Side: Title Info -->
        <div class="flex flex-col md:items-start text-left interactive glass-panel-rect p-6 min-w-[250px]">
            <h1 class="text-5xl font-bold tracking-tight mb-2" id="planet-name">地球</h1>
            <p class="text-gray-400 text-sm mb-1" id="planet-distance">距离: 1.00 AU</p>
            <p class="text-gray-400 text-sm mb-4" id="planet-radius">半径: 6,371 km</p>
            <div id="planet-cycle" class="bg-[#2dd4bf] text-black px-4 py-1.5 rounded-full text-sm font-semibold inline-block shadow-[0_0_15px_rgba(45,212,191,0.3)]">
                公转周期: 1.00 年
            </div>
        </div>
    </div>

    <!-- Middle: Planet Navigation -->
    <div class="ui-layer w-full px-4 flex justify-center mt-auto mb-auto pointer-events-auto">
        <div class="glass-panel p-1.5 flex gap-1 overflow-x-auto no-scrollbar max-w-full" id="planet-nav">
            <button class="nav-btn interactive" data-planet="mercury">水星</button>
            <button class="nav-btn interactive" data-planet="venus">金星</button>
            <button class="nav-btn active interactive" data-planet="earth">地球</button>
            <button class="nav-btn interactive" data-planet="mars">火星</button>
            <button class="nav-btn interactive" data-planet="jupiter">木星</button>
            <button class="nav-btn interactive" data-planet="saturn">土星</button>
            <button class="nav-btn interactive" data-planet="uranus">天王星</button>
            <button class="nav-btn interactive" data-planet="neptune">海王星</button>
        </div>
    </div>

    <!-- Bottom UI: Actions -->
    <div class="ui-layer p-6 w-full flex justify-center pb-8">
        <div class="flex gap-3 overflow-x-auto no-scrollbar max-w-full px-4 interactive">
            <button class="action-btn">比较</button>
            <button class="action-btn font-mono">PX 12 PY 3.3.5</button>
            <button class="action-btn primary flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                </svg>
                探索
            </button>
            <button class="action-btn">悬停背包 10.3.48</button>
            <button class="action-btn">路线</button>
        </div>
    </div>

    <!-- Three.js Logic -->
    <script>
        // --- 1. Basic Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Add subtle fog to blend the planet edges into the dark background
        scene.fog = new THREE.FogExp2(0x11131a, 0.05);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Position camera to match the perspective in the image (slightly below center)
        camera.position.set(0, 0, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Sharp rendering on high DPI screens
        container.appendChild(renderer.domElement);

        // --- 2. Lighting ---
        // Ambient light for general visibility
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);

        // Main directional light (Sunlight) coming from top left
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);
        
        // Backlight for a subtle rim light effect on the dark side
        const backLight = new THREE.DirectionalLight(0xa0aec0, 0.2);
        backLight.position.set(-5, -3, -5);
        scene.add(backLight);

        // --- 3. Planet Data & Textures ---
        const textureLoader = new THREE.TextureLoader();
        const textureCache = {};

        function loadTexture(url) {
            if (!url) return null;
            if (textureCache[url]) return textureCache[url];
            const texture = textureLoader.load(url);
            textureCache[url] = texture;
            return texture;
        }

        const planetsData = {
            mercury: {
                name: '水星',
                map: 'Mercury.png', // Placeholder, we'll override below
                fallbackColor: 0x888888,
                distance: '0.39 AU',
                radius: '2,440 km',
                cycle: '0.24 年',
                temp: '167°C',
                moons: '0',
                hasClouds: false,
                tilt: 0.03
            },
            venus: {
                name: '金星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0xe3bb76,
                distance: '0.72 AU',
                radius: '6,052 km',
                cycle: '0.62 年',
                temp: '464°C',
                moons: '0',
                hasClouds: false,
                tilt: 177.3
            },
            earth: {
                name: '地球',
                map: 'earth-blue-marble.jpg',
                bumpMap: 'earth-topology.png',
                specularMap: 'earth-water.png',
                cloudsMap: 'earth-clouds10k.png',
                fallbackColor: 0x2233ff,
                distance: '1.00 AU',
                radius: '6,371 km',
                cycle: '1.00 年',
                temp: '15°C',
                moons: '1',
                hasClouds: true,
                tilt: 23.5
            },
            mars: {
                name: '火星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0xc1440e,
                distance: '1.52 AU',
                radius: '3,389 km',
                cycle: '1.88 年',
                temp: '-65°C',
                moons: '2',
                hasClouds: false,
                tilt: 25.2
            },
            jupiter: {
                name: '木星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0xd39c7e,
                distance: '5.20 AU',
                radius: '69,911 km',
                cycle: '11.86 年',
                temp: '-110°C',
                moons: '95',
                hasClouds: false,
                tilt: 3.1
            },
            saturn: {
                name: '土星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0xead6b8,
                distance: '9.58 AU',
                radius: '58,232 km',
                cycle: '29.46 年',
                temp: '-140°C',
                moons: '146',
                hasClouds: false,
                tilt: 26.7
            },
            uranus: {
                name: '天王星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0x4b70dd,
                distance: '19.22 AU',
                radius: '25,362 km',
                cycle: '84.01 年',
                temp: '-195°C',
                moons: '28',
                hasClouds: false,
                tilt: 97.8
            },
            neptune: {
                name: '海王星',
                map: 'earth-blue-marble.jpg', // Placeholder
                fallbackColor: 0x274687,
                distance: '30.05 AU',
                radius: '24,622 km',
                cycle: '164.8 年',
                temp: '-200°C',
                moons: '16',
                hasClouds: false,
                tilt: 28.3
            }
        };

        // Replace with reliable texture URLs
        planetsData.mercury.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mercury.jpg';
        planetsData.venus.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/venus_surface.jpg';
        // Earth stays the same (it was working)
        planetsData.mars.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/mars.jpg';
        planetsData.jupiter.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/jupiter.jpg';
        planetsData.saturn.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/saturn.jpg';
        planetsData.uranus.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/uranus.jpg';
        planetsData.neptune.map = 'https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/neptune.jpg';


        // --- STREAMING_CHUNK:Creating 3D meshes for planet and clouds... ---
        // Group to hold Planet and clouds
        const planetGroup = new THREE.Group();
        scene.add(planetGroup);

        const detail = 64; 
        const geometry = new THREE.SphereGeometry(1.5, detail, detail);

        // Initial Material (Earth)
        const currentData = planetsData['earth'];
        planetGroup.rotation.z = currentData.tilt * Math.PI / 180; 

        const material = new THREE.MeshPhongMaterial({
            map: loadTexture(currentData.map),
            bumpMap: loadTexture(currentData.bumpMap),
            bumpScale: 0.015,
            specularMap: loadTexture(currentData.specularMap),
            specular: new THREE.Color('grey'),
            shininess: 35
        });

        const planetMesh = new THREE.Mesh(geometry, material);
        planetGroup.add(planetMesh);

        // Clouds
        const cloudGeometry = new THREE.SphereGeometry(1.515, detail, detail);
        const cloudMaterial = new THREE.MeshPhongMaterial({
            map: loadTexture(currentData.cloudsMap),
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false 
        });
        const cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
        planetGroup.add(cloudMesh);

        // Atmosphere glow (subtle blue halo)
        const atmosphereGeometry = new THREE.SphereGeometry(1.55, detail, detail);
        // Simple custom shader for atmosphere glow
        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 4.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        scene.add(atmosphere);

        // --- STREAMING_CHUNK:Setting up OrbitControls for interaction... ---
        // --- 5. Controls (Dragging & Rotating) ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enableZoom = false; // Disable zoom to maintain UI layout
        controls.enablePan = false;
        // Limit vertical rotation so user can't look completely from top/bottom
        controls.minPolarAngle = Math.PI / 3;
        controls.maxPolarAngle = Math.PI * 2/3;

        // --- STREAMING_CHUNK:Defining animation loop and resize handler... ---
        // --- 6. Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Auto-rotation
            planetMesh.rotation.y += 0.001;
            if(cloudMesh.visible) {
                 cloudMesh.rotation.y += 0.0012;
            }

            controls.update(); // required if controls.enableDamping is true
            renderer.render(scene, camera);
        }

        // --- 7. Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- STREAMING_CHUNK:Implementing UI interaction and planet switching logic... ---
        // --- 8. Start Application ---
        window.onload = () => {
            // Initial animation
            planetGroup.scale.set(0.1, 0.1, 0.1);
            let scale = 0.1;
            
            const introAnim = setInterval(() => {
                scale += (1 - scale) * 0.1; 
                planetGroup.scale.set(scale, scale, scale);
                atmosphere.scale.set(scale, scale, scale);
                
                if (scale > 0.99) {
                    planetGroup.scale.set(1, 1, 1);
                    atmosphere.scale.set(1, 1, 1);
                    clearInterval(introAnim);
                }
            }, 16);

            animate();
        };

        // --- 9. UI Interactivity & Planet Switching ---
        const navBtns = document.querySelectorAll('.nav-btn');
        const planetTitle = document.getElementById('planet-name');
        const planetDistance = document.getElementById('planet-distance');
        const planetRadius = document.getElementById('planet-radius');
        const planetCycle = document.getElementById('planet-cycle');
        const statTemp = document.getElementById('stat-temp');
        const statMoons = document.getElementById('stat-moons');
        
        function changePlanet(planetId) {
            const data = planetsData[planetId];
            if(!data) return;

            // Update UI Texts
            planetTitle.innerText = data.name;
            planetDistance.innerText = `距离: ${data.distance}`;
            planetRadius.innerText = `半径: ${data.radius}`;
            planetCycle.innerText = `公转周期: ${data.cycle}`;
            statTemp.innerText = data.temp;
            statMoons.innerText = data.moons;

            // Update 3D Model Properties
            planetMesh.rotation.y = 0;
            cloudMesh.rotation.y = 0;
            planetGroup.rotation.z = data.tilt * Math.PI / 180;

            // Update textures or colors
            material.map = loadTexture(data.map) || null;
            
            if (!material.map) {
                // Use solid color fallback for planets without textures mapped
                material.color.setHex(data.fallbackColor);
                material.bumpMap = null;
                material.specularMap = null;
                atmosphere.visible = false; 
            } else {
                 // Reset color to white so the texture displays correctly
                material.color.setHex(0xffffff);
                material.bumpMap = loadTexture(data.bumpMap) || null;
                material.specularMap = loadTexture(data.specularMap) || null;
                // Only show the blue atmosphere glow for Earth
                atmosphere.visible = (planetId === 'earth');
            }
            material.needsUpdate = true;

            // Handle Clouds
            if (data.hasClouds && data.cloudsMap) {
                cloudMaterial.map = loadTexture(data.cloudsMap);
                cloudMesh.visible = true;
                cloudMaterial.needsUpdate = true;
            } else {
                cloudMesh.visible = false;
            }

            // Visual flair: slightly animate scale when switching
            planetGroup.scale.set(0.8, 0.8, 0.8);
            let s = 0.8;
            const switchAnim = setInterval(()=>{
                s += (1-s)*0.2;
                planetGroup.scale.set(s,s,s);
                if(s > 0.99) {
                    planetGroup.scale.set(1,1,1);
                    clearInterval(switchAnim);
                }
            }, 16);
        }

        navBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                navBtns.forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                const planetId = e.target.getAttribute('data-planet');
                changePlanet(planetId);
            });
        });

    </script>
</body>
</html>
